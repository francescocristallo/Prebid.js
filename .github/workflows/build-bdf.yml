name: Build BDF Prebid
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate modules.json
        run: |
          echo '[
            "rubiconBidAdapter",
            "sovrnBidAdapter",
            "sharethroughBidAdapter",
            "schain",
            "userId",
            "sharedIdSystem",
            "id5IdSystem",
            "uid2IdSystem",
            "consentManagementTcf",
            "consentManagementUsp",
            "currency",
            "priceFloors"
          ]' > modules.json

      - name: Build BDF Version
        run: npx gulp build --modules=modules.json

      - name: Rebrand to bdfpbjs
        # REFINED LOGIC: Safely rebrands global variables without breaking internal strings
        run: |
          sed -i 's/pbGlobal: *"pbjs"/pbGlobal:"bdfpbjs"/g' build/dist/prebid.js
          sed -i 's/window.pbjs/window.bdfpbjs/g' build/dist/prebid.js
          sed -i "s/window\['pbjs'\]/window['bdfpbjs']/g" build/dist/prebid.js
          sed -i 's/window\["pbjs"\]/window["bdfpbjs"]/g' build/dist/prebid.js

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: bdf-prebid-build
          path: build/dist/prebid.js
