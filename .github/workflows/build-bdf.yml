name: Build BDF Prebid
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build BDF Version
        # We build the standard version first
        run: npx gulp build --modules=modules.json

      - name: Rebrand to bdfpbjs
        # 1. Replace the internal config setting
        # 2. Replace the window check at the top of the file
        # 3. Replace the "pbjs.queue" references
        run: |
          sed -i 's/pbGlobal:"pbjs"/pbGlobal:"bdfpbjs"/g' build/dist/prebid.js
          sed -i 's/window.pbjs/window.bdfpbjs/g' build/dist/prebid.js
          sed -i 's/"pbjs"/"bdfpbjs"/g' build/dist/prebid.js

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: bdf-prebid-build
          path: build/dist/prebid.js
