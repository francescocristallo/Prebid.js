name: Build BDF Prebid
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build BDF Version
        run: npx gulp build --modules=modules.json --globalVarName=bdfpbjs

      - name: Force Rename Global Variable
        # This manually patches the file to ensure 'bdfpbjs' is used
        run: sed -i 's/pbGlobal:"pbjs"/pbGlobal:"bdfpbjs"/g' build/dist/prebid.js

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: bdf-prebid-build
          path: build/dist/prebid.js
